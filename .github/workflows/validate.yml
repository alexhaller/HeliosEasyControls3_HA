name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff + mypy + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # ruff and mypy are pinned: both promote new checks in minor releases,
      # which silently turns a green build red. Bump them deliberately.
      - run: pip install ruff==0.16.1 mypy==2.3.0 homeassistant "websockets>=16.0" types-python-dateutil pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/
      - name: pip-audit (manifest.json requirements)
        run: |
          python -c "
          import json
          reqs = json.load(open('custom_components/HeliosEasyControls3_HA/manifest.json'))['requirements']
          open('_reqs_tmp.txt', 'w').write('\n'.join(reqs))
          "
          pip-audit -r _reqs_tmp.txt
